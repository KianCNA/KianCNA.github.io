<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的推送 · 资费监控</title>
<script src="tc-app.js"></script>
<style>
  :root{--bg:#f4f7fc;--card:#fff;--bd:#e3e8f1;--tx:#16202e;--tx2:#6b7686;--ac:#3f6fd8;--ac2:#2f5cc0;
        --bad:#c5221f;--ok:#0f7a46;--warn:#b06f00;--sh:0 10px 34px rgba(20,40,80,.09)}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1520;--card:#151f2b;--bd:#26313f;--tx:#e8eefb;--tx2:#93a2b8;
        --ac:#5b8af0;--ac2:#4a79df;--bad:#ff8a95;--ok:#5ee9a4;--warn:#e0a63a;--sh:0 14px 44px rgba(0,0,0,.45)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:22px 16px 96px}
  .head{max-width:900px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .head h1{margin:0;font-size:19px}
  .head .sub{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.6}
  .btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);
       font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--ac)}
  .btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn.pri:hover{background:var(--ac2)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .wrap{max-width:900px;margin:0 auto;display:grid;gap:13px}
  .sub{background:var(--card);border:1px solid var(--bd);border-radius:15px;box-shadow:var(--sh);padding:15px 16px}
  .sub .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sub .nm{font-size:15px;font-weight:700}
  .sub .ch{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(63,111,216,.12);color:var(--ac)}
  .sub .st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .sub .st.on{background:rgba(15,122,70,.13);color:var(--ok)}
  .sub .st.off{background:rgba(127,150,190,.16);color:var(--tx2)}
  .sub .meta{margin-top:9px;font-size:12.5px;color:var(--tx2);line-height:1.75;word-break:break-all}
  .sub .meta code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(127,150,190,.14);padding:1px 6px;border-radius:5px;color:var(--tx)}
  .sub .ops{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .mini{height:31px;padding:0 12px;font-size:12.5px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-family:inherit}
  .mini:hover{border-color:var(--ac);color:var(--ac)}
  .mini.d:hover{border-color:var(--bad);color:var(--bad)}
  .empty{background:var(--card);border:1px dashed var(--bd);border-radius:15px;padding:44px 20px;text-align:center;color:var(--tx2);font-size:13.5px;line-height:1.9}
  .mask{position:fixed;inset:0;background:rgba(10,18,30,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:9998}
  .mask.show{display:flex}
  .dlg{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:520px;padding:22px;box-shadow:0 24px 66px rgba(0,0,0,.35)}
  .dlg h3{margin:0 0 16px;font-size:16px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:6px}
  .fld .tip{font-size:11.5px;color:var(--tx2);margin-top:5px;line-height:1.6}
  .inp,select.inp,textarea.inp{width:100%;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);
       font-size:13.5px;padding:10px 12px;outline:none;font-family:inherit}
  .inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(63,111,216,.15)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--bd);border-radius:999px;
        font-size:12.5px;cursor:pointer;user-select:none;color:var(--tx2)}
  .chip input{margin:0;accent-color:var(--ac);width:14px;height:14px}
  .chip.on{border-color:var(--ac);color:var(--ac);background:rgba(63,111,216,.1)}
  .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#16202e;color:#fff;padding:10px 18px;
         border-radius:10px;font-size:13px;z-index:99999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:.96}
  .res{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.65;word-break:break-all;
       background:rgba(127,150,190,.12);color:var(--tx2);white-space:pre-wrap;display:none}
  .res.show{display:block}
  .res.ok{background:rgba(15,122,70,.12);color:var(--ok)}
  .res.bad{background:rgba(197,34,31,.1);color:var(--bad)}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>我的推送配置</h1>
    <div class="sub">每个账号独立保存，互相看不到。<br>资费有变更时，按你设置的渠道和范围自动推送。</div>
  </div>
  <div style="display:flex;gap:9px">
    <button class="btn" onclick="location.href='index.html'">返回首页</button>
    <button class="btn pri" id="addBtn">＋ 新增渠道</button>
  </div>
</div>

<div class="wrap" id="list"><div class="empty">加载中…</div></div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  if (!TC.guard()) return;
  TC.mountBar();

  var $ = function(id){ return document.getElementById(id); };
  var list = $('list'), mask = $('mask'), dlg = $('dlg');

  var CH = {
    dingtalk:{name:'钉钉群机器人', fields:[
      {k:'webhook',label:'Webhook 地址',ph:'https://oapi.dingtalk.com/robot/send?access_token=...',req:true},
      {k:'secret',label:'加签密钥（可选）',ph:'SEC...',tip:'机器人安全设置若选「加签」，把 SEC 开头的密钥填这里'} ]},
    feishu:{name:'飞书群机器人', fields:[
      {k:'webhook',label:'Webhook 地址',ph:'https://open.feishu.cn/open-apis/bot/v2/hook/...',req:true},
      {k:'secret',label:'签名校验密钥（可选）',ph:'机器人「签名校验」里的密钥'} ]},
    wecom:{name:'企业微信群机器人', fields:[
      {k:'webhook',label:'Webhook 地址',ph:'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...',req:true} ]},
    bark:{name:'Bark（iOS）', fields:[
      {k:'server',label:'服务器地址',ph:'https://api.day.app',tip:'用官方服务器保持默认即可，自建填自己的地址'},
      {k:'device_key',label:'设备 Key',ph:'Bark App 首页那串 Key',req:true},
      {k:'group',label:'分组（可选）',ph:'资费监控'} ]},
    wechat:{name:'微信公众号（测试号）', fields:[
      {k:'appid',label:'AppID',ph:'wx...',req:true},
      {k:'secret',label:'AppSecret',ph:'',req:true},
      {k:'template_id',label:'模板 ID',ph:'',req:true},
      {k:'touser',label:'接收者 OpenID',ph:'',req:true},
      {k:'data_map',label:'模板字段映射（可选，JSON）',ph:'{"first":"title","keyword1":"title","keyword2":"time","remark":"text"}',tip:'不填则默认使用 first/keyword1/keyword2/remark'} ]},
    email:{name:'邮件', fields:[
      {k:'to',label:'收件邮箱',ph:'you@example.com',req:true} ]}
  };

  var OPS = [['mobile','中国移动'],['unicom','中国联通'],['telecom','中国电信'],['gb','中国广电']];
  var PROVS = [['quanguo','全国性资费'],['beijing','北京'],['tianjin','天津'],['hebei','河北'],['shanxi','山西'],['neimenggu','内蒙古'],
    ['liaoning','辽宁'],['jilin','吉林'],['heilongjiang','黑龙江'],['shanghai','上海'],['jiangsu','江苏'],
    ['zhejiang','浙江'],['anhui','安徽'],['fujian','福建'],['jiangxi','江西'],['shandong','山东'],['henan','河南'],
    ['hubei','湖北'],['hunan','湖南'],['guangdong','广东'],['guangxi','广西'],['hainan','海南'],['chongqing','重庆'],
    ['sichuan','四川'],['guizhou','贵州'],['yunnan','云南'],['xizang','西藏'],['shaanxi','陕西'],['gansu','甘肃'],
    ['qinghai','青海'],['ningxia','宁夏'],['xinjiang','新疆']];
  var TYPES = [['package','套餐'],['card','号卡'],['broadband','宽带'],['addon','加装包'],['other','其他']];
  var EVENTS = [['new','新增'],['remove','下架'],['price','变更']];

  var NAME = {}; OPS.concat(PROVS).forEach(function(p){ NAME[p[0]] = p[1]; });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},2200); }
  function scopeText(s){
    if (!s || !Object.keys(s).length) return '全部资费（不限运营商 / 省份 / 类型）';
    var parts=[];
    function seg(key,label){ if (Array.isArray(s[key]) && s[key].length) parts.push(label+'：'+s[key].map(function(x){return NAME[x]||x;}).join('、')); }
    seg('operators','运营商'); seg('provinces','省份'); seg('types','类型'); seg('events','变更');
    return parts.length ? parts.join(' ｜ ') : '全部资费';
  }

  var subs = [];

  async function load(){
    try {
      var r = await TC.req('/subs');
      subs = r.subs || [];
      render();
    } catch (e) {
      list.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    }
  }

  function render(){
    if (!subs.length) {
      list.innerHTML = '<div class="empty">还没有配置推送渠道<br>点右上角「＋ 新增渠道」，配置钉钉 / 飞书 / 企业微信 / Bark / 微信 / 邮件</div>';
      return;
    }
    list.innerHTML = subs.map(function(s){
      var ch = CH[s.channel] || {name:s.channel};
      var m = s.credential_masked || {};
      var kv = Object.keys(m).map(function(k){
        if (k === 'has_secret') return '加签：<code>' + (m[k] ? '已配置' : '未配置') + '</code>';
        return esc(k) + '：<code>' + esc(m[k]) + '</code>';
      }).join(' ｜ ');
      return '<div class="sub" data-id="' + s.id + '">' +
        '<div class="top">' +
          '<span class="nm">' + esc(s.label || ch.name) + '</span>' +
          '<span class="ch">' + esc(ch.name) + '</span>' +
          '<span class="st ' + (s.enabled ? 'on' : 'off') + '">' + (s.enabled ? '已启用' : '已停用') + '</span>' +
        '</div>' +
        '<div class="meta">推送范围：' + esc(scopeText(s.scope)) + '<br>凭据：' + (kv || '—') + '</div>' +
        '<div class="ops">' +
          '<button class="mini" data-act="test">发送测试</button>' +
          '<button class="mini" data-act="edit">编辑</button>' +
          '<button class="mini" data-act="toggle">' + (s.enabled ? '停用' : '启用') + '</button>' +
          '<button class="mini d" data-act="del">删除</button>' +
        '</div>' +
        '<div class="res"></div>' +
      '</div>';
    }).join('');
  }

  list.addEventListener('click', async function(ev){
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var card = b.closest('.sub');
    var id = card.getAttribute('data-id');
    var s = subs.filter(function(x){ return String(x.id) === String(id); })[0];
    var act = b.getAttribute('data-act');
    var res = card.querySelector('.res');

    if (act === 'test') {
      b.disabled = true; b.textContent = '发送中…';
      res.className = 'res show'; res.textContent = '正在按当前配置发送测试消息…';
      try {
        var r = await TC.req('/subs/' + id + '/test', { method:'POST' });
        res.className = 'res show ' + (r.ok ? 'ok' : 'bad');
        res.textContent = (r.ok ? '✅ 发送成功\n' : '❌ 发送失败\n') + '渠道：' + (CH[r.channel] ? CH[r.channel].name : r.channel) + '\n返回：' + (r.detail || '（无返回内容）');
      } catch (e) {
        res.className = 'res show bad'; res.textContent = '❌ ' + e.message;
      }
      b.disabled = false; b.textContent = '发送测试';
      return;
    }

    if (act === 'toggle') {
      try { await TC.req('/subs/' + id, { method:'PATCH', body:{ enabled: !s.enabled } }); load(); }
      catch (e) { toast(e.message); }
      return;
    }

    if (act === 'del') {
      if (!confirm('删除这个推送渠道？')) return;
      try { await TC.req('/subs/' + id, { method:'DELETE' }); toast('已删除'); load(); }
      catch (e) { toast(e.message); }
      return;
    }

    if (act === 'edit') return openForm(s);
  });

  function close(){ mask.classList.remove('show'); dlg.innerHTML=''; }
  mask.addEventListener('click', function(ev){ if (ev.target === mask) close(); });

  function chipGroup(id, items, selected){
    return '<div class="chips" data-group="' + id + '">' + items.map(function(p){
      var on = selected && selected.indexOf(p[0]) >= 0;
      return '<label class="chip' + (on ? ' on' : '') + '"><input type="checkbox" value="' + p[0] + '"' + (on ? ' checked' : '') + '>' + p[1] + '</label>';
    }).join('') + '</div>';
  }
  function bindChips(){
    dlg.querySelectorAll('.chip input').forEach(function(inp){
      inp.addEventListener('change', function(){ inp.parentNode.classList.toggle('on', inp.checked); });
    });
  }
  function readChips(group){
    var box = dlg.querySelector('[data-group="' + group + '"]');
    if (!box) return [];
    return Array.from(box.querySelectorAll('input:checked')).map(function(i){ return i.value; });
  }

  function openForm(existing){
    var isEdit = !!existing;
    var chKey = isEdit ? existing.channel : 'dingtalk';
    var scope = (isEdit && existing.scope) || {};

    dlg.innerHTML =
      '<h3>' + (isEdit ? '编辑推送渠道' : '新增推送渠道') + '</h3>' +
      '<div class="fld"><label>渠道类型</label>' +
        '<select class="inp" id="fCh"' + (isEdit ? ' disabled' : '') + '>' +
        Object.keys(CH).map(function(k){ return '<option value="' + k + '"' + (k === chKey ? ' selected' : '') + '>' + CH[k].name + '</option>'; }).join('') +
        '</select></div>' +
      '<div class="fld"><label>备注名</label><input class="inp" id="fLabel" placeholder="例如：我的钉钉群 / 我的 iPhone" value="' + esc(isEdit ? existing.label : '') + '"></div>' +
      '<div id="fFields"></div>' +
      '<div class="fld"><label>运营商（不勾=全部）</label>' + chipGroup('operators', OPS, scope.operators) + '</div>' +
      '<div class="fld"><label>省份（不勾=全国）</label>' + chipGroup('provinces', PROVS, scope.provinces) + '</div>' +
      '<div class="fld"><label>资费类型（不勾=全部）</label>' + chipGroup('types', TYPES, scope.types) + '</div>' +
      '<div class="fld"><label>变更类型（不勾=全部）</label>' + chipGroup('events', EVENTS, scope.events) + '</div>' +
      '<div class="acts"><button class="btn" id="dc">取消</button><button class="btn pri" id="ds">' + (isEdit ? '保存' : '添加') + '</button></div>';

    mask.classList.add('show');
    bindChips();

    function renderFields(){
      var key = $('fCh').value;
      var def = CH[key];
      $('fFields').innerHTML = def.fields.map(function(f){
        return '<div class="fld"><label>' + f.label + (f.req ? ' *' : '') + '</label>' +
          '<input class="inp" data-k="' + f.k + '" placeholder="' + esc(f.ph || '') + '" autocomplete="off">' +
          (f.tip ? '<div class="tip">' + f.tip + '</div>' : '') + '</div>';
      }).join('') + (isEdit ? '<div class="tip" style="margin:-6px 0 12px">留空的字段保持原值不变，只填需要修改的。</div>' : '');
    }
    renderFields();
    if (!isEdit) $('fCh').addEventListener('change', renderFields);

    $('dc').onclick = close;
    $('ds').onclick = async function(){
      var key = $('fCh').value;
      var cred = {};
      dlg.querySelectorAll('[data-k]').forEach(function(inp){
        var v = inp.value.trim();
        if (!v) return;
        if (inp.getAttribute('data-k') === 'data_map') {
          try { v = JSON.parse(v); } catch (e) { throw new Error('模板字段映射不是合法 JSON'); }
        }
        cred[inp.getAttribute('data-k')] = v;
      });
      if (!isEdit) {
        var need = CH[key].fields.filter(function(f){ return f.req; });
        for (var i = 0; i < need.length; i++) {
          if (!cred[need[i].k]) { alert('请填写：' + need[i].label); return; }
        }
      }
      var body = {
        label: $('fLabel').value.trim(),
        scope: { operators: readChips('operators'), provinces: readChips('provinces'), types: readChips('types'), events: readChips('events') }
      };
      if (Object.keys(cred).length) body.credential = cred;

      this.disabled = true;
      try {
        if (isEdit) await TC.req('/subs/' + existing.id, { method:'PATCH', body: body });
        else { body.channel = key; await TC.req('/subs', { method:'POST', body: body }); }
        close(); toast(isEdit ? '已保存' : '已添加，建议点「发送测试」验证一下'); load();
      } catch (e) {
        alert(e.message); this.disabled = false;
      }
    };
  }

  $('addBtn').addEventListener('click', function(){ openForm(null); });
  load();
})();
</script>
</body>
</html>
