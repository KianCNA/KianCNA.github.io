name: Mobile Heartbeat
# 仓库内自续心跳：绕过 GitHub schedule 对本仓库丢触发/延迟数小时的问题。
#
# 为什么不能只靠 workflow_run 自续：上一版在每轮抓取结束后由 workflow_run
# 触发本工作流，睡 95 分钟再用 GITHUB_TOKEN dispatch 下一轮。但按 GitHub
# 规则，GITHUB_TOKEN 触发的运行不会产生可级联的 workflow_run 事件（仅
# workflow_dispatch / repository_dispatch 例外），链条只能从 schedule/手动
# 触发的那轮往后续一跳：2026-10-24 #33（GITHUB_TOKEN 触发）结束后心跳
# 再未启动，北京 11 点那一轮缺失，只能等被延迟近 2 小时的 schedule 兜底。
#
# 现改为单个长驻运行内部循环：等线上数据够旧 → 触发一轮抓取 → 等它结束 →
# 重复。运行接近 6 小时上限前用 workflow_dispatch 续期一个新心跳运行
# （workflow_dispatch 是 GITHUB_TOKEN 允许级联的例外，已实测可用），
# 循环永续，不再依赖 schedule 与 workflow_run。workflow_run 触发保留
# 作为入口：手动/schedule 触发的抓取结束后自动拉起或重启心跳。
# 循环中断时由 build-watchdog 兜底；两路触发撞车由 mobile-build 并发组去重。
#
# 每轮等待的时长按 latest.json 的 updated 倒推，而不是固定睡 95 分钟：
# 320 分钟预算耗尽时由新心跳接管，固定睡眠会让新心跳重新睡满一轮。
# 2026-10-27 北京 16:58→19:54 的空窗即由此产生（老心跳 10:19Z 到期，
# 新心跳 11:55Z 才醒，中间只等到一次碰巧准点的 schedule）。

on:
  workflow_run:
    workflows: ["Mobile Fetch & Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: mobile-heartbeat
  # 新心跳启动时旧心跳可能仍在收尾，直接取消即可，新心跳已接管循环
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # GitHub 托管 runner 单 job 上限 6 小时；DEADLINE 留足余量保证
    # 运行总是自己收尾并完成续期，而不是被 timeout 强杀后断链
    # 350 分钟的长驻 job 会长期占住 runner 名额，一旦平台侧卡死就变成无法清理的
    # 僵尸（实测跑了 8+ 小时仍在 in_progress，同组后续运行全部 pending）。
    # 缩短到 120 分钟，靠退出时自续期保持循环。
    timeout-minutes: 120
    steps:
      - name: 循环驱动抓取
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DEADLINE=$(( $(date -u +%s) + 100 * 60 ))
          API_BASE="${API_BASE:-https://socialist-cow-d3glswv91d832ff2d-1252525450.ap-shanghai.app.tcloudbase.com/api}"
          # 节奏（2026-11-26 调整）：
          #   全量轮抓完 → 间隔 30 分钟 → 再抓
          #   优先轮（只抓订阅省份）抓完 → 间隔 15 分钟 → 再抓
          # 两类轮共用 mobile-build 的同一并发组，因此在本心跳里串行排队、不并发。
          GAP_FULL=1800
          GAP_PRIO=900
          # 派发过一轮后至少隔 10 分钟再试：既防构建连续失败时原地热循环，
          # 也防派发后 GitHub 尚未把运行登记为 queued 时重复派发。
          MIN_GAP=600
          ATTEMPTED=0

          api() {
            local url="$1" i out
            for i in 1 2 3; do
              if out=$(curl -fsSL --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: mobile-heartbeat" "$url" 2>/tmp/api_err); then
                printf '%s' "$out"; return 0
              fi
              echo "[warn] API 失败（$i/3）：$(head -c 120 /tmp/api_err)" >&2
              sleep 10
            done
            return 1
          }

          api_post() {
            local url="$1" i
            for i in 1 2 3; do
              if curl -fsS --max-time 30 -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: mobile-heartbeat" \
                -H "Content-Type: application/json" \
                -d '{"ref":"main"}' "$url" >/dev/null 2>/tmp/api_err; then
                return 0
              fi
              echo "[warn] 派发失败（$i/3）：$(head -c 120 /tmp/api_err)" >&2
              sleep 10
            done
            return 1
          }

          RENEWED=0
          renew() {
            [ "$RENEWED" = "1" ] && return 0
            RENEWED=1
            # 已有别的运行在跑/排队时不要再派一个：心跳与 workflow_run 触发会同秒撞车，
            # 出现两个同分钟启动的 Mobile Heartbeat，新运行 cancel-in-progress 立刻把
            # 刚起的那轮取消（2026-11-25 10:29 实测）。排除自身，避免自我否决。
            local n
            n=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-heartbeat.yml/runs?per_page=10" 2>/dev/null \
              | jq --argjson self "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self) | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" != "0" ]; then
              echo "已有 $n 个心跳在运行/排队，跳过续期"
              return 0
            fi
            if api_post "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-heartbeat.yml/dispatches"; then
              echo "已续期新心跳 $(date -u +%FT%TZ)"
            else
              echo "::warning::心跳续期失败，等待 build-watchdog 兜底"
            fi
          }
          trap renew EXIT

          count_active() {
            local j
            j=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-build.yml/runs?per_page=5" || true)
            # 取不到运行列表时按「有运行」处理，宁可本轮不触发，下轮再试
            [ -n "$j" ] || { echo 1; return 0; }
            printf '%s' "$j" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length'
          }

          # 距下一个「偶数 UTC 整点」（mobile-build 的 cron 点）还有多少分钟。
          # 抓取已从 ~25 分钟涨到 ~50 分钟，心跳若在整点前 30 分钟内再派发一
          # 轮，会和准点定时轮撞在同一个并发组里，被 cancel-in-progress 直接
          # 掐死（2026-11-21 15:41 那轮跑了 18 分钟被 16:00 整点轮取消，白跑）。
          # 距下一个「6 小时兜底整点」还有多少分钟（mobile-build 的 cron 为 0 */6）
          minutes_to_cron() {
            local now next
            now=$(date -u +%s)
            next=$(( ( now / 21600 + 1 ) * 21600 ))
            echo $(( (next - now) / 60 ))
          }

          data_age() {
            UPDATED=$(curl -fsSL -H 'Cache-Control: no-cache' \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/latest.json" \
              | jq -r '.updated // empty') || UPDATED=""
            [ -n "$UPDATED" ] || { echo 999999; return; }
            UPDATED_TS=$(date -u -d "$UPDATED" +%s 2>/dev/null) || { echo 999999; return; }
            echo $(( $(date -u +%s) - UPDATED_TS ))
          }

          # 后端调度状态：last_full / last_priority 的完成时刻，决定下一轮该抓什么
          sched_json() {
            curl -fsSL --max-time 20 "${API_BASE}/internal/sched" 2>/dev/null || true
          }

          age_of() {
            local json="$1" key="$2" at ts
            at=$(printf '%s' "$json" | jq -r --arg k "$key" '.state[$k].at // empty' 2>/dev/null) || at=""
            [ -n "$at" ] || { echo 999999; return; }
            ts=$(date -u -d "$at" +%s 2>/dev/null) || { echo 999999; return; }
            echo $(( $(date -u +%s) - ts ))
          }

          # 把所有账号订阅里的省份聚合成 focus 抓取目标（后端只返回去重省份，不含身份信息）
          priority_provs() {
            curl -fsSL --max-time 20 "${API_BASE}/internal/priority-targets" 2>/dev/null \
              | jq -r '.focus_provs // empty' 2>/dev/null || echo ""
          }

          dispatch_build() {
            # 参数：1=mode  2=focus_provs  3=round_tag
            local mode="$1" provs="$2" tag="$3" i body
            body=$(jq -nc --arg m "$mode" --arg p "$provs" --arg t "$tag" \
              '{ref:"main", inputs:{mode:$m, focus_provs:$p, round_tag:$t}}')
            for i in 1 2 3; do
              if curl -fsS --max-time 30 -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: mobile-heartbeat" \
                -H "Content-Type: application/json" \
                -d "$body" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-build.yml/dispatches" \
                >/dev/null 2>/tmp/api_err; then
                return 0
              fi
              echo "[warn] 派发失败（$i/3）：$(head -c 120 /tmp/api_err)" >&2
              sleep 10
            done
            return 1
          }

          while :; do
            LEFT=$(( DEADLINE - $(date -u +%s) ))
            if [ "$LEFT" -le 0 ]; then break; fi

            S=$(sched_json)
            if [ -n "$S" ] && printf '%s' "$S" | jq -e '.ok == true' >/dev/null 2>&1; then
              AF=$(age_of "$S" last_full)
              AP=$(age_of "$S" last_priority)
              SRC="后端状态"
            else
              # 后端不可用：退回按 latest.json 陈旧度只跑全量，优先轮跳过，避免整站停更
              AF=$(data_age)
              AP=999999
              SRC="兜底判断"
            fi

            if [ "$AF" -ge "$GAP_FULL" ]; then
              KIND="full"; WAIT=0
            elif [ "$AP" -ge "$GAP_PRIO" ]; then
              KIND="priority"; WAIT=0
            else
              WF=$(( GAP_FULL - AF )); WP=$(( GAP_PRIO - AP ))
              if [ "$WF" -le "$WP" ]; then KIND="full"; WAIT=$WF; else KIND="priority"; WAIT=$WP; fi
            fi
            if [ "$ATTEMPTED" = "1" ] && [ "$WAIT" -lt "$MIN_GAP" ]; then WAIT=$MIN_GAP; fi
            if [ "$WAIT" -lt 0 ]; then WAIT=0; fi
            if [ "$WAIT" -gt "$LEFT" ]; then WAIT=$LEFT; fi

            echo "=== [$SRC] 距全量 ${AF}s / 距优先 ${AP}s → 下一轮 $KIND，睡眠 $((WAIT/60)) 分钟至 $(date -u -d "+${WAIT} seconds" +%FT%TZ) ==="
            sleep "$WAIT"
            if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then break; fi

            ATTEMPTED=1
            ACTIVE=$(count_active)
            M2C=$(minutes_to_cron)
            if [ "$ACTIVE" = "0" ] && [ "$M2C" -le 40 ]; then
              # 让位于即将到来的 6 小时兜底轮：那一轮会 cancel-in-progress 掐掉正在跑的本轮
              echo "距兜底轮只剩 ${M2C} 分钟，本轮不派发，交给 schedule"
              sleep 600
              continue
            fi
            if [ "$ACTIVE" != "0" ]; then
              echo "已有 $ACTIVE 个抓取运行在进行/排队，等待其结束"
            else
              if [ "$KIND" = "priority" ]; then
                PROVS=$(priority_provs)
                if [ -z "$PROVS" ]; then
                  echo "没有订阅省份，本轮降级为全量"
                  KIND="full"
                fi
              fi
              if [ "$KIND" = "priority" ]; then
                if dispatch_build "focus" "$PROVS" "priority"; then
                  echo "已派发优先轮（$PROVS）$(date -u +%FT%TZ)"
                else
                  echo "::warning::优先轮派发失败，等下一轮循环或兜底任务补上"
                fi
              else
                if dispatch_build "full" "" ""; then
                  echo "已派发全量轮 $(date -u +%FT%TZ)"
                else
                  echo "::warning::全量轮派发失败，等下一轮循环或兜底任务补上"
                fi
              fi
            fi

            while [ "$(date -u +%s)" -lt "$DEADLINE" ]; do
              sleep 60
              ACTIVE=$(count_active)
              if [ "$ACTIVE" = "0" ]; then break; fi
            done
            echo "抓取已结束 $(date -u +%FT%TZ)"
          done

          echo "时间预算用尽 $(date -u +%FT%TZ)"
          renew
